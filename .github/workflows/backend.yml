name: Compiler backends
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      # The Go backend's execution corpus; clang ships with the runner image.
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
      - run: bun install
      - name: TypeScript
        run: bunx tsc --noEmit
      - name: Regression tests (reference corpus and emission)
        run: bun test
      # Phase-7 exit gate: strict C11 at -O0 under ASan/UBSan and at -O2, and Go,
      # over the whole accepted corpus, plus host-export and command-line builds.
      # CI=true makes a missing toolchain a failure rather than a skip.
      - name: Execution gate
        env:
          LAMINAR_EXEC: '1'
        run: bun test test/corpus.test.ts test/host-exports.test.ts test/compiler.test.ts
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: backend-failures
          path: |
            /tmp/laminar-c-*
            /tmp/laminar-go-*
            /tmp/laminar-build-*
