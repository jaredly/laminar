name: C backend
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install
      - name: Required tests
        run: |
          bun test
          bunx tsc --noEmit
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: backend-failures
          path: /tmp/laminar-c-*
